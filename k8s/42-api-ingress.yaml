apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: fleet-management
  labels:
    app.kubernetes.io/name: api
spec:
  ingressClassName: nginx
  rules:
    - host: fleet.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
