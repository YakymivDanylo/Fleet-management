apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: fleet-management
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: fleet-management
spec:
  replicas: 1                      
  strategy:
    type: Recreate                 
  selector:
    matchLabels:                   
      app.kubernetes.io/name: postgres
  template:                        
    metadata:
      labels:                      
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: fleet-management
    spec:
      containers:
        - name: postgres
          image: postgres:16       
          ports:
            - containerPort: 5432   
          env:
            - name: POSTGRES_DB
              valueFrom: { configMapKeyRef: { name: fleet-config, key: POSTGRES_DB } }
            - name: POSTGRES_USER
              valueFrom: { configMapKeyRef: { name: fleet-config, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: fleet-secret, key: POSTGRES_PASSWORD } }
            - name: PGDATA        
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests: { cpu: 100m, memory: 256Mi }  
            limits:   { cpu: 500m, memory: 512Mi }
          readinessProbe:          
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
          livenessProbe:           
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 20 
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data              
          persistentVolumeClaim:
            claimName: postgres-data