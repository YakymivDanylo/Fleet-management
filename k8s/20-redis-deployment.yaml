apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: fleet-management
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: fleet-management
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: fleet-management
    spec:
      containers:
        - name: redis
          image: redis:7-alpine         
          ports:
            - containerPort: 6379
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 250m, memory: 128Mi }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }   
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 15