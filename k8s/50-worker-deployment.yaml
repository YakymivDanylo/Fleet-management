apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: fleet-management
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: fleet-management
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/part-of: fleet-management
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: worker
          image: fleet-management-worker:1.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: fleet-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: fleet-secret, key: POSTGRES_PASSWORD } }
            - name: RABBITMQ_DEFAULT_USER
              valueFrom: { secretKeyRef: { name: fleet-secret, key: RABBITMQ_DEFAULT_USER } }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: { secretKeyRef: { name: fleet-secret, key: RABBITMQ_DEFAULT_PASS } }
            - name: DATABASE_URL
              value: "postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
            - name: RABBITMQ_URL
              value: "amqp://$(RABBITMQ_DEFAULT_USER):$(RABBITMQ_DEFAULT_PASS)@rabbitmq:5672/"
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { cpu: 250m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
