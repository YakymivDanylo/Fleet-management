repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  # Lab 5: analyzers must always see UTF-8 without BOM and LF line endings (see
  # docs/lab5-quality-governance/REPORT.md, reliability test).
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-ast
  # Lab 6: block commits that stage a function with cyclomatic complexity > 10
  # (scripts/complexity_gate.py runs the radon CLI on the staged files only).
  - repo: local
    hooks:
      - id: complexity-gate
        name: complexity gate (radon, CC <= 10)
        entry: python scripts/complexity_gate.py
        language: python
        additional_dependencies: [radon==6.0.1]
        files: ^(src|scripts)/.*\.py$
