{{- if .Values.rollout.enabled }}
{{- $ctx := dict "root" . "component" "api" -}}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "fleet.componentName" $ctx }}
  labels:
    {{- include "fleet.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  progressDeadlineSeconds: {{ .Values.progressDeadlineSeconds }}
  selector:
    matchLabels:
      {{- include "fleet.selectorLabels" $ctx | nindent 6 }}
  template:
    {{- include "fleet.apiPodTemplate" . | nindent 4 }}
  strategy:
    {{- toYaml .Values.rollout.strategy | nindent 4 }}
{{- end }}
