{{- $ctx := dict "root" . "component" "api" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fleet.componentName" $ctx }}
  labels:
    {{- include "fleet.labels" $ctx | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "fleet.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
