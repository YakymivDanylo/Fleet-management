# Default values - correspond to the development environment.
# Secrets are intentionally EMPTY here: when left empty the chart reuses the value
# already stored in the cluster Secret, or generates a random one on first install.

nameOverride: ""
fullnameOverride: ""

# ---- API (FastAPI) ----
replicaCount: 2
# Seconds a rollout may stay stuck before the Deployment is reported as failed (Argo CD: Degraded)
progressDeadlineSeconds: 600

# Progressive delivery (Argo Rollouts). false -> a plain Deployment with RollingUpdate;
# true -> the API is a Rollout (Deployment is not rendered) and `strategy` is passed to it as is.
rollout:
  enabled: false
  strategy: {}
  # Lab 7: AnalysisTemplate "<fullname>-success-rate" asks Prometheus for the share of non-5xx
  # requests (threshold 95 %). A canary `analysis` step (or blue-green prePromotionAnalysis)
  # references it by name; a failed run aborts the rollout automatically.
  analysis:
    enabled: false
    prometheusAddress: http://kps-prometheus.monitoring:9090
    selector: 'namespace="fleet"'   # label filter of the PromQL query
    successThreshold: 0.95
    interval: 30s
    count: 4
    failureLimit: 1

# Extra environment variables of the API container (e.g. FAIL_RATE - share of requests answered
# with 500, simulates a bad release; lab 7 step 6).
env: []
# stdout log format of the API: json (machine-readable, for Loki) | text
logFormat: json

# ---- Observability (Lab 7) ----
# metrics.enabled renders a ServiceMonitor (Prometheus scrapes GET <path> from the API Service)
# and a ConfigMap with the Grafana dashboard (picked up by the Grafana sidecar by its label).
metrics:
  enabled: false
  path: /metrics
  interval: 15s

# PrometheusRule: alert when more than `threshold` of the responses are 5xx for `for`.
alerts:
  enabled: false
  threshold: 0.05
  for: 1m

image:
  repository: fleet-management-api
  tag: "1.0.0"            # empty -> Chart.appVersion
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 80
  nodePort: null          # null -> auto-assigned (lets the chart be installed twice)

ingress:
  enabled: false
  className: nginx
  host: fleet.local
  path: /
  annotations: {}

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits:   { cpu: 500m, memory: 256Mi }

# ---- Telemetry worker ----
worker:
  replicaCount: 1
  image:
    repository: fleet-management-worker
    tag: "1.0.0"
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { cpu: 250m, memory: 256Mi }

# ---- PostgreSQL ----
postgres:
  replicaCount: 1
  image:
    repository: postgres
    tag: "16"
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  persistence:
    enabled: true         # false -> emptyDir (data is lost with the pod)
    size: 1Gi
    storageClass: ""
    accessMode: ReadWriteOnce

# ---- Redis ----
redis:
  replicaCount: 1
  image:
    repository: redis
    tag: 7-alpine
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 250m, memory: 128Mi }

# ---- RabbitMQ ----
rabbitmq:
  replicaCount: 1
  image:
    repository: rabbitmq
    tag: 4-management-alpine
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
    accessMode: ReadWriteOnce

# ---- Application configuration (ConfigMap) ----
config:
  appName: "Fleet Management (dev)"
  telemetryQueue: telemetry
  resilienceEnabled: true
  accessTokenExpireMinutes: 30
  appEnv: sandbox         # sandbox | production (the app validates the DB name suffix against it)
  postgresDb: fleet_sandbox   # must end with _sandbox (sandbox) or _production (production)
  postgresUser: fleet_user

# ---- Sensitive configuration (Secret) - never commit real values ----
# existingSecret: name of a Secret created outside the chart (GitOps: kubectl create secret ...).
# When set, the chart renders no Secret and all pods read credentials from that one.
# It must contain the keys POSTGRES_PASSWORD, RABBITMQ_DEFAULT_USER, RABBITMQ_DEFAULT_PASS, JWT_SECRET_KEY.
existingSecret: ""
secret:
  postgresPassword: ""
  rabbitmqUser: fleet
  rabbitmqPassword: ""
  jwtSecretKey: ""

# ---- Hooks ----
hooks:
  preUpgrade:
    enabled: true         # Job that checks PostgreSQL is reachable before every upgrade
