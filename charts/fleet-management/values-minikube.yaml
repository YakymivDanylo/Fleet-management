# Minikube environment deployed by Argo CD (Application argocd-apps/fleet-management.yaml).
# The only thing that changes on a release is the image tag - Argo CD picks it up from Git.
# No secrets here: the Secret "fleet-secret" is created by hand once (see docs/lab5-gitops/DEMO.md).
replicaCount: 5

# Progressive delivery with Argo Rollouts (lab 6) + automatic rollback by metrics (lab 7).
# Canary, 5 replicas -> 20% = 1 pod, 60% = 3. The manual gate is replaced by an `analysis` step:
# AnalysisTemplate "fleet-management-success-rate" asks Prometheus for the share of non-5xx
# requests; < 95 % -> AnalysisRun Failed -> automatic abort, traffic returns to the stable version.
rollout:
  enabled: true
  analysis:
    enabled: true
    prometheusAddress: http://kps-prometheus.monitoring:9090
    selector: 'namespace="fleet"'
  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause: {duration: 30s}          # let the metrics of the new pod accumulate
        - setWeight: 60
        - pause: {duration: 30s}

# Extra env of the API pods. FAIL_RATE = share of requests answered with 500 (bad release demo).
env:
  - name: FAIL_RATE
    value: "0.5"

# Lab 7: ServiceMonitor + Grafana dashboard (ConfigMap) + PrometheusRule alert
metrics:
  enabled: true
alerts:
  enabled: true

# A broken image tag turns the app Degraded after 120 s instead of the default 10 min (demo, lab step 6b)
progressDeadlineSeconds: 120

# Created manually with kubectl; the chart renders no Secret of its own.
existingSecret: fleet-secret

image:
  repository: ghcr.io/yakymivdanylo/fleet-management-api
  tag: "1.5.0"
  pullPolicy: IfNotPresent

worker:
  image:
    repository: ghcr.io/yakymivdanylo/fleet-management-worker
    tag: "1.1.0"

ingress:
  enabled: false

config:
  appName: "Fleet Management (minikube, GitOps)"

hooks:
  # The pre-upgrade hook is mapped by Argo CD to PreSync, i.e. it would run BEFORE PostgreSQL
  # exists on the very first sync and fail it. The API init container already waits for Postgres.
  preUpgrade:
    enabled: false
