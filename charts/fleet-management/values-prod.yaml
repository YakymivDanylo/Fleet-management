# Production-like environment: more replicas and resources, newer image, Ingress on.
# helm install fleet charts/fleet-management -f charts/fleet-management/values-prod.yaml
# Secrets are NOT stored here - pass them with --set secret.postgresPassword=... etc.
replicaCount: 3

image:
  tag: "1.1.0"

ingress:
  enabled: true
  host: fleet.local

resources:
  requests: { cpu: 200m, memory: 192Mi }
  limits:   { cpu: 750m, memory: 384Mi }

config:
  appName: "Fleet Management (prod)"
