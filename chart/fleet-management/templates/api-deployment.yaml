{{- $ctx := dict "root" . "component" "api" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fleet.componentName" $ctx }}
  labels:
    {{- include "fleet.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "fleet.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "fleet.labels" $ctx | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      initContainers:
        - name: wait-for-postgres
          image: {{ include "fleet.image" (dict "image" .Values.postgres.image "root" .) }}
          command: ["sh", "-c", "until pg_isready -h {{ include "fleet.postgresHost" . }} -p 5432 -U \"$POSTGRES_USER\"; do echo waiting for postgres; sleep 2; done"]
          env:
            - name: POSTGRES_USER
              valueFrom: { configMapKeyRef: { name: {{ include "fleet.configName" . }}, key: POSTGRES_USER } }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
      containers:
        - name: api
          image: {{ include "fleet.image" (dict "image" .Values.image "root" .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: {{ include "fleet.configName" . }}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "fleet.secretName" . }}, key: POSTGRES_PASSWORD } }
            - name: JWT_SECRET_KEY
              valueFrom: { secretKeyRef: { name: {{ include "fleet.secretName" . }}, key: JWT_SECRET_KEY } }
            - name: DATABASE_URL
              value: "postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@{{ include "fleet.postgresHost" . }}:5432/$(POSTGRES_DB)"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet: { path: /livez, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /livez, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          securityContext:
            allowPrivilegeEscalation: false
