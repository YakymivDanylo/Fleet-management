{{- $ctx := dict "root" . "component" "redis" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fleet.componentName" $ctx }}
  labels:
    {{- include "fleet.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ .Values.redis.replicaCount }}
  selector:
    matchLabels:
      {{- include "fleet.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fleet.labels" $ctx | nindent 8 }}
    spec:
      containers:
        - name: redis
          image: {{ include "fleet.image" (dict "image" .Values.redis.image "root" .) }}
          ports:
            - containerPort: 6379
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 15
