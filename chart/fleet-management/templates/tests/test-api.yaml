{{- $ctx := dict "root" . "component" "test" -}}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "fleet.componentName" $ctx }}
  labels:
    {{- include "fleet.labels" $ctx | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
  containers:
    - name: check-api
      image: {{ include "fleet.image" (dict "image" .Values.image "root" .) }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command:
        - python
        - -c
        - |
          import json, sys, urllib.request
          base = "http://{{ include "fleet.componentName" (dict "root" . "component" "api") }}:{{ .Values.service.port }}"
          health = json.load(urllib.request.urlopen(base + "/health", timeout=5))
          info = json.load(urllib.request.urlopen(base + "/info", timeout=5))
          print("health:", health)
          print("info:", info)
          sys.exit(0 if health.get("status") == "ok" and health.get("db") == "connected" else 1)
      securityContext:
        allowPrivilegeEscalation: false
