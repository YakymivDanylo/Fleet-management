{{- $root := . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fleet.secretName" . }}
  labels:
    {{- include "fleet.labels" (dict "root" . "component" "secret") | nindent 4 }}
type: Opaque
data:
  POSTGRES_PASSWORD: {{ include "fleet.secretValue" (dict "root" $root "key" "POSTGRES_PASSWORD" "value" .Values.secret.postgresPassword) | b64enc | quote }}
  RABBITMQ_DEFAULT_USER: {{ .Values.secret.rabbitmqUser | b64enc | quote }}
  RABBITMQ_DEFAULT_PASS: {{ include "fleet.secretValue" (dict "root" $root "key" "RABBITMQ_DEFAULT_PASS" "value" .Values.secret.rabbitmqPassword) | b64enc | quote }}
  JWT_SECRET_KEY: {{ include "fleet.secretValue" (dict "root" $root "key" "JWT_SECRET_KEY" "value" .Values.secret.jwtSecretKey) | b64enc | quote }}
