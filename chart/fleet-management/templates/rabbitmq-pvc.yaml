{{- if .Values.rabbitmq.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "fleet.componentName" (dict "root" . "component" "rabbitmq") }}-data
  labels:
    {{- include "fleet.labels" (dict "root" . "component" "rabbitmq") | nindent 4 }}
spec:
  accessModes: [{{ .Values.rabbitmq.persistence.accessMode | quote }}]
  {{- with .Values.rabbitmq.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.rabbitmq.persistence.size }}
{{- end }}
