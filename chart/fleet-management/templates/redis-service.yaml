{{- $ctx := dict "root" . "component" "redis" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fleet.redisHost" . }}
  labels:
    {{- include "fleet.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "fleet.selectorLabels" $ctx | nindent 4 }}
  ports:
    - port: 6379
      targetPort: 6379
