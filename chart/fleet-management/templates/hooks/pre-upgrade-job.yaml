{{- if .Values.hooks.preUpgrade.enabled }}
{{- $ctx := dict "root" . "component" "pre-upgrade" -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "fleet.componentName" $ctx }}
  labels:
    {{- include "fleet.labels" $ctx | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        {{- include "fleet.selectorLabels" $ctx | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: check-postgres
          image: {{ include "fleet.image" (dict "image" .Values.postgres.image "root" .) }}
          command:
            - sh
            - -c
            - |
              echo "pre-upgrade: checking PostgreSQL before upgrading release {{ .Release.Name }} (revision {{ .Release.Revision }})"
              pg_isready -h {{ include "fleet.postgresHost" . }} -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          env:
            - name: POSTGRES_USER
              valueFrom: { configMapKeyRef: { name: {{ include "fleet.configName" . }}, key: POSTGRES_USER } }
            - name: POSTGRES_DB
              valueFrom: { configMapKeyRef: { name: {{ include "fleet.configName" . }}, key: POSTGRES_DB } }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
{{- end }}
