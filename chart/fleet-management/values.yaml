# Default values - correspond to the development environment.
# Secrets are intentionally EMPTY here: when left empty the chart reuses the value
# already stored in the cluster Secret, or generates a random one on first install.

nameOverride: ""
fullnameOverride: ""

# ---- API (FastAPI) ----
replicaCount: 2

image:
  repository: fleet-management-api
  tag: "1.0.0"            # empty -> Chart.appVersion
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 80
  nodePort: null          # null -> auto-assigned (lets the chart be installed twice)

ingress:
  enabled: false
  className: nginx
  host: fleet.local
  path: /
  annotations: {}

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits:   { cpu: 500m, memory: 256Mi }

# ---- Telemetry worker ----
worker:
  replicaCount: 1
  image:
    repository: fleet-management-worker
    tag: "1.0.0"
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { cpu: 250m, memory: 256Mi }

# ---- PostgreSQL ----
postgres:
  replicaCount: 1
  image:
    repository: postgres
    tag: "16"
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  persistence:
    enabled: true         # false -> emptyDir (data is lost with the pod)
    size: 1Gi
    storageClass: ""
    accessMode: ReadWriteOnce

# ---- Redis ----
redis:
  replicaCount: 1
  image:
    repository: redis
    tag: 7-alpine
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 250m, memory: 128Mi }

# ---- RabbitMQ ----
rabbitmq:
  replicaCount: 1
  image:
    repository: rabbitmq
    tag: 4-management-alpine
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
    accessMode: ReadWriteOnce

# ---- Application configuration (ConfigMap) ----
config:
  appName: "Fleet Management (dev)"
  telemetryQueue: telemetry
  resilienceEnabled: true
  accessTokenExpireMinutes: 30
  postgresDb: fleet_management
  postgresUser: fleet_user

# ---- Sensitive configuration (Secret) - never commit real values ----
secret:
  postgresPassword: ""
  rabbitmqUser: fleet
  rabbitmqPassword: ""
  jwtSecretKey: ""

# ---- Hooks ----
hooks:
  preUpgrade:
    enabled: true         # Job that checks PostgreSQL is reachable before every upgrade
