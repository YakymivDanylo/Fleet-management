apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fleet-management
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YakymivDanylo/Fleet-management.git
    targetRevision: main
    path: charts/fleet-management
    helm:
      valueFiles:
        - values-minikube.yaml # path is relative to the chart directory
  destination:
    server: https://kubernetes.default.svc
    namespace: fleet
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # The Rollout kind exists only after the argo-rollouts controller (CRDs) is installed;
    # retry until it appears instead of staying in SyncFailed.
    retry:
      limit: 5
      backoff: {duration: 10s, factor: 2, maxDuration: 3m}
    syncOptions:
      - CreateNamespace=true
