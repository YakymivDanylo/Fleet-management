# Lab 6 - Round Robin (default algorithm): requests go to api1, api2, api3 in turn
# Selected by NGINX_CONF in .env (default: nginx/round_robin.conf), mounted as conf.d/default.conf.
log_format lb '$remote_addr [$time_local] "$request" $status upstream=$upstream_addr '
              'ustatus=$upstream_status rt=$request_time urt=$upstream_response_time';

# `zone` puts the balancing state (round-robin position, fail counters) in shared memory.
# Without it every nginx worker process keeps its own counters and the rotation is not strict.
upstream fleet_api {
    zone fleet_api 64k;
    server api1:8000 max_fails=2 fail_timeout=10s;
    server api2:8000 max_fails=2 fail_timeout=10s;
    server api3:8000 max_fails=2 fail_timeout=10s;
}

server {
    listen 80;
    access_log /dev/stdout lb;

    location / {
        proxy_pass http://fleet_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Passive health check: a refused/timed-out connection or a 502/503/504 is retried on
        # the next replica, and after max_fails the replica is skipped for fail_timeout.
        proxy_connect_timeout 1s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;

        add_header X-Upstream-Addr $upstream_addr always;
    }

    # Answers from nginx itself, so the balancer can be checked independently of the replicas.
    location = /lb-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
