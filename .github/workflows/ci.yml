name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test (${{matrix.service}})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fleet_user
          POSTGRES_PASSWORD: fleet_password
          POSTGRES_DB: fleet_management_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fleet_user -d fleet_management_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://fleet_user:fleet_password@localhost:5432/fleet_management_test
      TEST_REDIS_URL: redis://localhost:6379/15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      
      - name: Build (install package)
        run: |
          pip install -r requirements-dev.txt
          pip install --no-deps -e .

      - name: Test (api)
        if: matrix.service == 'api'
        run: pytest tests/unit/test_rental_service.py tests/integration/test_api.py -v

      - name: Test (worker)
        if: matrix.service == 'worker'
        run: pytest tests/unit/test_telemetry_schema.py tests/integration/test_telemetry_worker.py -v
  lint:
    name: Lint(ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            
      - name: Build (install dependencies)
        run: | 
            pip install --only-binary :all: -r requirements-dev.txt
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
  
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} 
  build:
    name: Build Image (${{matrix.service}})
    runs-on: ubuntu-latest
    needs: [test, lint, sonarcloud]
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: Dockerfile
          - service: worker
            dockerfile: Dockerfile.worker
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: fleet-management-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
        
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: fleet-management-${{ matrix.service }}:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

  publish:
      name: Publish image (${{ matrix.service }})
      runs-on: ubuntu-latest
      needs: build
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      permissions:
        contents: read
        packages: write
      strategy:
        fail-fast: false
        matrix:
          include:
            - service: api
              dockerfile: Dockerfile
            - service: worker
              dockerfile: Dockerfile.worker
      steps:
        - name: Checkout
          uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
  
        - name: Lowercase repository owner
          run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
  
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
  
        - name: Log in to GHCR
          uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}
  
        - name: Build and push
          uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
          with:
            context: .
            file: ${{ matrix.dockerfile }}
            push: true
            tags: |
              ghcr.io/${{ env.OWNER_LC }}/fleet-management-${{ matrix.service }}:${{ github.sha }}
              ghcr.io/${{ env.OWNER_LC }}/fleet-management-${{ matrix.service }}:latest
            cache-from: type=gha,scope=${{ matrix.service }}
            cache-to: type=gha,mode=max,scope=${{ matrix.service }}        