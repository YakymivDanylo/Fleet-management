name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test (${{matrix.service}})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fleet_user
          POSTGRES_PASSWORD: fleet_password
          POSTGRES_DB: fleet_management_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fleet_user -d fleet_management_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://fleet_user:fleet_password@localhost:5432/fleet_management_test
      TEST_REDIS_URL: redis://localhost:6379/15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      
      - name: Build (install package)
        run: |
          pip install -r requirements-dev.txt
          pip install --no-deps -e .

      - name: Test (api)
        if: matrix.service == 'api'
        run: pytest tests/unit/test_rental_service.py tests/integration/test_api.py -v

      - name: Test (worker)
        if: matrix.service == 'worker'
        run: pytest tests/unit/test_telemetry_schema.py tests/integration/test_telemetry_worker.py -v