# Lab 11: Documentation as Code pipeline — "не збирається — не їде".
#   lint (markdownlint) ─┐
#   api-contract (Spectral) ┼─> build (mkdocs build --strict) ─> deploy (GitHub Pages)
#   review-audit (review_date) ─ runs in parallel, also every morning (cron)
# Any warning of the strict build (dead link, missing anchor, page outside nav, unresolved
# [[wikilink]]) ends the job with Exit Code 1, so a broken document is never published.
name: Docs

on:
  push:
    paths:
      - "docs/**"
      - "docs_hooks/**"
      - "mkdocs.yml"
      - "README.md"
      - "requirements-docs.txt"
      - ".markdownlint-cli2.yaml"
      - ".spectral.yaml"
      - "scripts/docs_review_audit.py"
      - "scripts/kb_graph.py"
      - ".github/workflows/docs.yml"
      # the Python reference page is rendered from the docstrings in src/
      - "src/**"
  pull_request:
    paths:
      - "docs/**"
      - "docs_hooks/**"
      - "mkdocs.yml"
      - "README.md"
      - "requirements-docs.txt"
      - ".markdownlint-cli2.yaml"
      - ".spectral.yaml"
      - "scripts/docs_review_audit.py"
      - "scripts/kb_graph.py"
      - ".github/workflows/docs.yml"
      # the Python reference page is rendered from the docstrings in src/
      - "src/**"
  schedule:
    # continuous currency audit: overdue review_date pages show up without anybody pushing
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Markdown style (markdownlint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: markdownlint-cli2 (README + docs/, rules in .markdownlint-cli2.yaml)
        run: npx --yes markdownlint-cli2@0.24.2

  api-contract:
    name: API contract (Spectral)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Spectral lint docs/api/openapi.yaml (0 errors)
        run: npx --yes @stoplight/spectral-cli@6.17.1 lint docs/api/openapi.yaml --fail-severity=error

  review-audit:
    name: Currency audit (review_date)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install PyYAML
        run: pip install PyYAML==6.0.3
      # Prints overdue pages into the job summary; fails only on overdue live pages or broken passports.
      - name: Overdue review_date pages
        run: python scripts/docs_review_audit.py --strict
      - name: Knowledge graph has no islands
        run: python scripts/kb_graph.py --strict

  build:
    name: Strict build (mkdocs build --strict)
    runs-on: ubuntu-latest
    needs: [lint, api-contract]
    steps:
      # 1. Full history: git-revision-date-localized takes "last updated" of every page from Git.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 2. Python for MkDocs and mkdocstrings
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      # 3. mkdocs-material with the plugins pinned in requirements-docs.txt
      - name: Install mkdocs-material and plugins
        run: pip install -r requirements-docs.txt
      # 4. Strict build: every warning = Exit Code 1
      - name: mkdocs build --strict
        run: mkdocs build --strict --site-dir site
      - name: Upload site artifact (for GitHub Pages)
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # Publish from the default branch, or from the preview branch named in the repository variable
    # DOCS_PREVIEW_BRANCH (lab demo before merge). PRs and other branches only build.
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref_name == github.event.repository.default_branch ||
       (vars.DOCS_PREVIEW_BRANCH != '' && github.ref_name == vars.DOCS_PREVIEW_BRANCH))
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
