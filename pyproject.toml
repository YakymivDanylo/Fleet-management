[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet-management"
version = "0.1.0"
description = "Station-based carsharing fleet management with IoT telemetry"
requires-python= ">=3.13"
dependencies = [
  "fastapi>=0.141",
  "uvicorn[standard]>=0.52",
  "sqlalchemy>=2.0",
  "asyncpg>=0.31",
  "pydantic-settings>=2.15",
  "python-dotenv>=1.2",
  "alembic>=1.20",
]

[project.optional-dependencies]
dev = [
  "ruff",
  "pre-commit",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
