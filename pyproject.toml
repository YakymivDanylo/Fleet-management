[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet-management"
version = "0.1.0"
description = "Station-based carsharing fleet management with IoT telemetry"
requires-python= ">=3.13"
dependencies = [
  "fastapi>=0.141",
  "uvicorn[standard]>=0.52",
  "sqlalchemy>=2.0",
  "asyncpg>=0.31",
  "pydantic-settings>=2.15",
  "python-dotenv>=1.2",
  "alembic>=1.20",
  "aio-pika>=10.0",
  "redis>=8.1",
  "pyjwt>=2.15",
  "pwdlib[argon2]>=0.3",
  "python-multipart>=0.0.32",
  "email-validator>=2.3",
]

[project.scripts]
telemetry-worker = 'fleet_management.telemetry.worker:main'
create-admin = 'fleet_management.cli:main'
telemetry-simulator = 'fleet_management.telemetry.simulator:main'

[project.optional-dependencies]
dev = [
  "ruff",
  "pre-commit",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fleet_management = ["web/static/**/*"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["alembic/versions", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/fleet_management"]
relative_files = true

[tool.mutmut]
# Balancing metric for Line Coverage (Lab 5, Task 2): mutation score of the pure domain
# logic that the unit suite claims to cover. Runs in the pinned Dockerfile.metrics image.
source_paths = [
  "src/fleet_management/services/rental_service.py",
  "src/fleet_management/privacy/sanitizer.py",
]
also_copy = ["src/fleet_management/"]
pytest_add_cli_args_test_selection = ["tests/unit/"]
