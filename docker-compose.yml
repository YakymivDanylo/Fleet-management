# One compose file serves both environments. Pick the environment with the env file and a
# distinct project name (separate containers, network and volumes per environment):
#   docker compose -p fleet_sandbox    --env-file .env.sandbox    up -d --build
#   docker compose -p fleet_production --env-file .env.production up -d --build
name: ${COMPOSE_PROJECT_NAME:-fleet_management}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in the env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in the env file}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image:  rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?set RABBITMQ_DEFAULT_USER in the env file}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS in the env file}
    ports:
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    # The management UI port is published, so rabbitmq also sits on the edge network.
    networks: [backend, edge]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10


  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    profiles: ["fault"]
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./loadtest/toxiproxy.json:/config/toxiproxy.json:ro
    ports:
      - "${TOXIPROXY_PORT:-8474}:8474"
    networks: [backend, edge]
    depends_on:
      redis:
        condition: service_healthy

  # Lab 6: schema migrations run once, before any replica starts. If every replica ran
  # `alembic upgrade head` from the image CMD, three of them would race on the same database.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: fleet_management_api:lab6
    command: ["alembic", "upgrade", "head"]
    environment:
      APP_ENV: ${APP_ENV:?set APP_ENV in the env file}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in the env file}
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy

  # Three identical API replicas. They are not published: the only way in is the nginx balancer.
  # `hostname` becomes the "pod" field of GET /info, which shows which replica answered.
  api1: &api
    image: fleet_management_api:lab6
    hostname: api1
    command: ["uvicorn", "fleet_management.main:app", "--host", "0.0.0.0", "--port", "8000",
              "--proxy-headers", "--forwarded-allow-ips=*"]
    environment:
      APP_ENV: ${APP_ENV:?set APP_ENV in the env file}
      DEBUG: ${DEBUG:-false}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RESILIENCE_ENABLED: ${RESILIENCE_ENABLED:-true}
      # Lab 7 optimisations; switch one off to measure the other on its own.
      LIST_CACHE_ENABLED: ${LIST_CACHE_ENABLED:-true}
      PASSWORD_HASH_WORKERS: ${PASSWORD_HASH_WORKERS:-1}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in the env file}
    # backend is internal, so the replicas are reachable only from nginx and other services.
    networks: [backend]
    # Fixed resource quota (Lab 5): latency numbers are only comparable between runs when
    # the measured container always gets the same CPU/RAM, not whatever the host has free.
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512M
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      toxiproxy:
        condition: service_started
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
  api2:
    <<: *api
    hostname: api2
  api3:
    <<: *api
    hostname: api3

  # Lab 6: single entry point and load balancer. The algorithm is picked by the config file,
  # e.g. NGINX_CONF=./nginx/least_conn.conf docker compose up -d --force-recreate nginx
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${API_PORT:-8000}:80"
    volumes:
      - ${NGINX_CONF:-./nginx/round_robin.conf}:/etc/nginx/conf.d/default.conf:ro
    networks: [backend, edge]
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
      api3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/lb-health"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      APP_ENV: ${APP_ENV:?set APP_ENV in the env file}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
    networks: [backend]
    depends_on:
      api1:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  k6:
    image: grafana/k6:1.3.0
    profiles: ["loadtest"]
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512M
    environment:
      BASE_URL: http://nginx
    volumes:
      - ./loadtest:/scripts
    networks: [edge]
    depends_on:
      nginx:
        condition: service_healthy

networks:
  # Internal: no route to the outside world and no published ports, so db/redis/worker are
  # reachable only by the other services on this network.
  backend:
    internal: true
  # Edge: the services whose ports are published to the host (api, management UIs, k6).
  edge:

volumes:
  pgdata:
  rabbitmq_data:
