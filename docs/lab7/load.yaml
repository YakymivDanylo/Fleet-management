# Background traffic for the Lab 7 demo (kept OUTSIDE the chart, namespace default).
# kubectl apply -f docs/lab7/load.yaml     # start, ~20 req/s per replica
# kubectl scale deploy/load --replicas=3   # more traffic
# kubectl delete -f docs/lab7/load.yaml    # stop
# Without traffic the AnalysisTemplate query returns NaN (0/0) and the analysis fails.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels: {app: load}
  template:
    metadata:
      labels: {app: load}
    spec:
      containers:
        - name: curl
          image: curlimages/curl
          command:
            - sh
            - -c
            - |
              while true; do
                for p in /version /info /version /info /nonexistent; do
                  curl -s -o /dev/null http://fleet-management-api.fleet.svc$p
                done
                sleep 0.05
              done
          resources:
            requests: {cpu: 20m, memory: 16Mi}
            limits: {cpu: 200m, memory: 32Mi}
