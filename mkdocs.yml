# Documentation as Code (Lab 11): the knowledge base is built from docs/ by MkDocs Material.
# `mkdocs build --strict` turns every warning below (dead link, missing anchor, page outside nav)
# into exit code 1, so a broken document stops the pipeline exactly like a red test.
site_name: Fleet Management — база знань
site_description: Станційний каршерінг з IoT-телеметрією — документація як код
site_author: Danylo Yakymiv
site_url: https://yakymivdanylo.github.io/Fleet-management/
repo_url: https://github.com/YakymivDanylo/Fleet-management
repo_name: YakymivDanylo/Fleet-management
edit_uri: edit/main/docs/
docs_dir: docs
copyright: Fleet Management · Documentation as Code

theme:
  name: material
  language: uk
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle: {icon: material/brightness-7, name: Темна тема}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle: {icon: material/brightness-4, name: Світла тема}

# Four levels of the documentation pyramid. Every page must be listed here:
# validation.nav.omitted_files=warn makes an orphan page fail the strict build.
nav:
  - "Рівень 1 · Що це": index.md
  - "Рівень 2 · Developer Docs":
      - developer/developer-index.md
      - developer/CONTRIBUTING.md
      - developer/local-setup.md
      - developer/code-standards.md
      - developer/handover.md
      - "Архів (deprecated)":
          - developer/documentation-regime.md
  - "Рівень 3 · API Docs":
      - api/api-overview.md
      - api/openapi-reference.md
      - api/contract-testing.md
      - api/sdk.md
      - api/python-reference.md
  - "Рівень 4 · Architecture Docs":
      - architecture/architecture-index.md
      - architecture/sdd.md
      - architecture/isd.md
      - "ADR":
          - architecture/adr/index.md
          - architecture/adr/adr-0001-postgresql-redis-rabbitmq-storage.md
          - architecture/adr/adr-0002-gitops-argo-canary-delivery.md
          - architecture/adr/adr-0003-plain-markdown-doc-passport.md
          - architecture/adr/adr-0004-documentation-as-code-mkdocs.md
          - architecture/adr/adr-0005-row-lock-on-rental-start.md
      - "Архів (deprecated)":
          - architecture/k8s-raw-manifests.md
  - "Експлуатація та супровід":
      - maintenance-plan.md
      - "SRE":
          - operations/slo-policy.md
          - runbooks/RB-001.md
          - runbooks/alert-catalog.md
      - "Управління змінами":
          - changes/RFC-001.md
          - changes/CCB-2026-11-20.md
          - changes/release-checklist.md
  - "Звіти":
      - lab11/REPORT.md
      - lab12/REPORT.md
  - tags.md

# Obsidian-style [[wikilinks]] -> regular Markdown links, so one source serves both the Obsidian
# graph and the static site; an unresolved wikilink is a warning (= strict failure).
hooks:
  - docs_hooks/wikilinks.py

plugins:
  - search:
      lang: [uk, en]
  - tags
  - mermaid2
  - swagger-ui-tag
  # "Last update" of every page from Git history — the input of the currency metric (Lab 8/10).
  - git-revision-date-localized:
      type: date
      locale: uk
      timezone: UTC
      enable_creation_date: false
      enable_git_follow: false
      # Not-yet-committed pages have no Git date; that fallback is logged as INFO instead of
      # failing --strict. CI checks out the full history (fetch-depth: 0), so real dates are used.
      strict: false
      fallback_to_build_date: true
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            docstring_style: google
            members_order: source
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # Reports include listings straight from the repository files (no copies to go stale);
  # a missing file is a build error.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      # mermaid2 renders ```mermaid blocks (C4 and flowcharts from Lab 10).
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - toc:
      permalink: true
      # Unicode slugs — the same anchors as GitHub renders for Ukrainian headings.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds: {case: lower}

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn
