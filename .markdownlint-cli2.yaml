# Lab 11: Markdown style gate of the knowledge base (stage `lint` of .github/workflows/docs.yml).
#   npx markdownlint-cli2@0.24.2
config:
  default: true
  # Ukrainian prose with long tables and links: a hard line limit only produces noise.
  MD013: false
  # Raw HTML is intentional: <swagger-ui> renders the API contract, <a id> anchors for SDD/ISD.
  MD033:
    allowed_elements: [swagger-ui, a, br]
  # Repeated sub-headings ("Контекст", "Рішення") are canonical in ADRs and runbooks.
  MD024:
    siblings_only: true
  # Front matter `title` is the page title for MkDocs; the body still starts with one H1.
  MD025:
    front_matter_title: ""
  MD041: false
  # Tables are aligned by content, not by pipes.
  MD060: false

globs:
  - "README.md"
  - "docs/**/*.md"
ignores:
  - "docs/**/evidence/**"
